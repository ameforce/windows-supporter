name: Release chain gate

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-chain-gate:
    name: release-chain-gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Configure target timezone
        shell: cmd
        run: |
          tzutil /s "Korea Standard Time"
          if errorlevel 1 exit /b 1
          tzutil /g | findstr /x /c:"Korea Standard Time"
          if errorlevel 1 exit /b 1
      - name: Run release tests
        shell: cmd
        run: |
          call tools\ensure_uv_ready.bat "%RUNNER_TEMP%\windows-supporter-uv.log"
          if errorlevel 1 exit /b 1
          "%WINDOWS_SUPPORTER_UV_EXE%" sync --locked --extra build
          if errorlevel 1 exit /b 1
          "%WINDOWS_SUPPORTER_UV_EXE%" run --locked python -m unittest discover -s tests -p "test_*.py"
      - name: Build release candidate without launching it
        shell: cmd
        env:
          WINDOWS_SUPPORTER_BUILD_ARTIFACT_ONLY: "1"
        run: call build.bat
      - name: Record release artifact SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath "dist\windows-supporter.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "artifact_sha256=$hash" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-supporter-${{ github.run_id }}-${{ github.sha }}
          path: dist/windows-supporter.exe
          if-no-files-found: error
          retention-days: 30
