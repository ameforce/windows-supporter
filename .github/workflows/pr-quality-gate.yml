name: PR quality gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.repository_id }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  pr-quality-gate:
    name: pr-quality-gate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout untrusted PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Prepare pinned uv environment
        shell: cmd
        timeout-minutes: 5
        run: |
          call tools\ensure_uv_ready.bat "%RUNNER_TEMP%\windows-supporter-uv.log"
          if errorlevel 1 exit /b 1
          "%WINDOWS_SUPPORTER_UV_EXE%" sync --locked --extra build
          if errorlevel 1 exit /b 1
      - name: Configure target timezone
        shell: cmd
        run: |
          tzutil /s "Korea Standard Time"
          if errorlevel 1 exit /b 1
          tzutil /g
      - name: Run unit and integration tests
        shell: cmd
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          call tools\ensure_uv_ready.bat "%RUNNER_TEMP%\windows-supporter-uv.log"
          if errorlevel 1 exit /b 1
          "%WINDOWS_SUPPORTER_UV_EXE%" run --locked python -m unittest discover -s tests -p "test_*.py" -v -f
      - name: Build artifact without launching it
        shell: cmd
        env:
          WINDOWS_SUPPORTER_BUILD_ARTIFACT_ONLY: "1"
        run: call build.bat
      - name: Record artifact SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath "dist\windows-supporter.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "artifact_sha256=$hash" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
      - name: Upload verified artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-supporter-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: dist/windows-supporter.exe
          if-no-files-found: error
          retention-days: 7
