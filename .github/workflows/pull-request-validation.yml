name: Pull request validation

on:
  pull_request:
    types:
      - labeled

permissions:
  contents: read

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  validate-pr-head:
    name: pull-request-validation
    if: >-
      ${{ github.event.pull_request.draft == false &&
      github.event.label.name == 'reviews-complete' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Record non-review scope
        shell: pwsh
        run: |
          "This workflow validates tests and build output. It does not perform or prove PR review." |
            Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
      - name: Checkout current PR merge candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable merge candidate identity
        shell: pwsh
        run: |
          $parts = @((git rev-list --parents -n 1 HEAD).Trim().Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries))
          if ($parts.Count -ne 3) {
            throw "Expected a two-parent PR merge candidate, got: $($parts -join ' ')"
          }
          $mergeSha = $parts[0].ToLowerInvariant()
          $baseSha = $parts[1].ToLowerInvariant()
          $headSha = $parts[2].ToLowerInvariant()
          $eventMergeSha = "${{ github.sha }}".ToLowerInvariant()
          $eventBaseSha = "${{ github.event.pull_request.base.sha }}".ToLowerInvariant()
          $eventHeadSha = "${{ github.event.pull_request.head.sha }}".ToLowerInvariant()
          if ($mergeSha -ne $eventMergeSha -or $baseSha -ne $eventBaseSha -or $headSha -ne $eventHeadSha) {
            throw "Merge identity mismatch: actual=$mergeSha/$baseSha/$headSha event=$eventMergeSha/$eventBaseSha/$eventHeadSha"
          }
          "base_sha=$baseSha" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
          "head_sha=$headSha" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
          "merge_candidate_sha=$mergeSha" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Prepare pinned uv environment
        shell: cmd
        timeout-minutes: 5
        run: |
          call tools\ensure_uv_ready.bat "%RUNNER_TEMP%\windows-supporter-uv.log"
          if errorlevel 1 exit /b 1
          "%WINDOWS_SUPPORTER_UV_EXE%" sync --locked --extra build
          if errorlevel 1 exit /b 1
      - name: Configure target timezone
        shell: cmd
        run: |
          tzutil /s "Korea Standard Time"
          if errorlevel 1 exit /b 1
          tzutil /g | findstr /x /c:"Korea Standard Time"
          if errorlevel 1 exit /b 1
      - name: Run unit and integration tests
        shell: cmd
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          call tools\ensure_uv_ready.bat "%RUNNER_TEMP%\windows-supporter-uv.log"
          if errorlevel 1 exit /b 1
          "%WINDOWS_SUPPORTER_UV_EXE%" run --locked python -m unittest discover -s tests -p "test_*.py" -v -f
      - name: Build merge-candidate artifact without launching it
        shell: cmd
        env:
          WINDOWS_SUPPORTER_BUILD_ARTIFACT_ONLY: "1"
        run: call build.bat
      - name: Record artifact SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath "dist\windows-supporter.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "artifact_sha256=$hash" | Tee-Object -FilePath "$env:GITHUB_STEP_SUMMARY" -Append
      - name: Upload merge-candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-supporter-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
          path: dist/windows-supporter.exe
          if-no-files-found: error
          retention-days: 7
