name: PR policy gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.repository_id }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  pr-policy-gate:
    name: pr-policy-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate PR policy from trusted base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/validate_pull_request_gate.py validate-event
          --event "$GITHUB_EVENT_PATH"
          --config .github/pr-gate/active-release.json
