<!doctype html><html lang="ko"><head><title>ChatGPT</title></head><body>
<!-- Sanitized legacy settings structure: the background main is not the usage panel. -->
<main><h1>무엇을 도와드릴까요?</h1><p>주간 사용 한도 99% 남음</p></main>
<div role="dialog" aria-labelledby="settings-title">
  <h2 id="settings-title">설정</h2>
  <button role="tab" aria-selected="true" aria-controls="settings-content-Usage">사용량</button>
  <div role="tabpanel" id="settings-content-Analytics" data-state="inactive" hidden>
    <h3>분석</h3><p>월간 사용 한도 55% 남음</p>
  </div>
  <div role="tabpanel" id="settings-content-Usage" data-state="active">
    <h3>사용량</h3><h4>크레딧</h4>
    <p>사용 한도에 도달했을 때 계속 사용하려면 크레딧을 구매하세요.</p>
    <div><div>1,234 크레딧 남음</div></div>
  </div>
</div>
</body></html>
